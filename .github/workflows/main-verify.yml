name: Verify main

# CI proper runs on branches and PRs, with `branches-ignore: [main]` so a
# merge does not re-run what the PR just ran. The gap that leaves: nothing
# ever verifies `main` ITSELF.
#
# That gap was not theoretical. A broken `COPY` in the Dockerfile (a path
# npm workspaces never create) sat on `main` from the very first commit and
# was only found when the first Dependabot PR happened to touch a Docker
# file and trip the path filter. Anything not covered by a PR's changed
# paths can rot on `main` unnoticed the same way.
#
# So this runs the FULL suite unconditionally after every push to main —
# no path filters, no skips. It is the backstop, not the gate.

on:
  push:
    branches: [main]
  schedule:
    # Weekly, so a break caused by something outside the repo (a base image
    # moving, an action retagging) surfaces without waiting for a commit.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-verify
  cancel-in-progress: true

jobs:
  verify:
    name: Full suite on main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm install --no-audit --no-fund --prefer-offline

      - name: No secrets, config or private assets tracked
        run: bash scripts/check-no-secrets.sh

      - run: npm run format:check
      - run: npm run lint --workspaces --if-present
      - run: npm run test --workspaces --if-present
      - run: npm run build --workspace=web

      - uses: docker/setup-buildx-action@v4

      - name: Docker build
        uses: docker/build-push-action@v7
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
